<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preload" href="/fonts/andika-bold.woff2" as="font" type="font/woff2" crossorigin />
    <title>Pip AAC</title>
    <style>
      /* Andika Bold (SIL OFL) — single-story a/g literacy letterforms.
         Self-hosted; the app is offline-first, never a CDN. Keyboard
         keycaps only. */
      @font-face {
        font-family: "Andika";
        src: url("/fonts/andika-bold.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      :root { --gap: 6px; }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, "Helvetica Neue", sans-serif;
        background: #f6f4ef;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: var(--gap);
        gap: var(--gap);
      }
      button { font: inherit; cursor: pointer; }
      #topbar { display: flex; gap: var(--gap); height: 52px; }
      #bar {
        flex: 1;
        border: 2px solid #d8d4c8;
        border-radius: 10px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 20px;
        color: #1a1a1a;
        gap: 8px;
        overflow-x: auto;
        font-weight: 600;
      }
      #bar:empty::before { content: "…"; color: #999; }
      .corner-btn {
        min-width: 52px;
        border: 2px solid #d8d4c8;
        border-radius: 10px;
        background: #fff;
        font-size: 22px;
      }
      /* Permanent strip: fixed height, always rendered. The 60-cell grid
         below never shifts — zero layout shift on prediction updates. */
      #strip {
        height: 80px;
        flex: none;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: var(--gap);
      }
      /* Prediction card: 2 columns wide, 1:1 square symbol/photo left,
         label right. Fitzgerald color of the candidate. */
      .pred {
        grid-column: span 2;
        border-radius: 12px;
        border: 3px solid #8a7fbf;
        background: #ece8f9;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: clamp(13px, 2.4vmin, 22px);
        color: #1a1a1a;
        overflow: hidden;
        text-align: left;
        padding: 0;
      }
      .pred .swatch {
        height: 100%;
        aspect-ratio: 1;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(18px, 3.4vmin, 34px);
        background: rgba(255, 255, 255, 0.55);
      }
      .pred .swatch img { width: 100%; height: 100%; object-fit: cover; }
      .pred .label { padding-right: 6px; }
      .pred.ghost {
        border-style: dashed;
        border-color: #cfc9bb;
        background: #efeadf;
        color: #a39c8a;
      }
      .pred.ghost .swatch { background: transparent; }
      /* Utility anchors: one column each, always visible. Same anatomy as
         .pred — glyph left, label right — adapted to a 1-column tile. */
      .anchor {
        border-radius: 12px;
        border: 3px solid #5b5348;
        background: #e8e3d6;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-weight: 700;
        font-size: clamp(10px, 1.7vmin, 14px);
        color: #3a352c;
        overflow: hidden;
        padding: 0 4px;
      }
      .anchor .glyph { font-size: clamp(16px, 3vmin, 28px); line-height: 1; flex: none; }
      .anchor span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      /* "Show me where": a 1.5s halo on the Groups anchor plus a fixed-
         position caption — out of flow, so zero layout shift, and
         pointer-events: none so it never eats a tap. */
      .anchor.halo { outline: 4px solid #2f6fd0; outline-offset: 2px; box-shadow: 0 0 14px rgba(47, 111, 208, 0.65); }
      #pathhint {
        position: fixed;
        z-index: 20;
        transform: translateX(-50%);
        background: #1a1a1a;
        color: #fff;
        font-weight: 700;
        font-size: 14px;
        padding: 4px 10px;
        border-radius: 8px;
        white-space: nowrap;
        pointer-events: none;
      }
      #grid { flex: 1; display: grid; gap: var(--gap); }
      /* Group index and group pages replace the grid in place — same 10×6
         geometry, same physical positions. Navigation is a board mode,
         never a modal; the strip and bar stay put. */
      #groupgrid { flex: 1; display: none; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(6, 1fr); gap: var(--gap); }
      body.groups #grid { display: none; }
      body.groups #groupgrid { display: grid; }
      /* Group cells: same footprint as .cell. Neutral navigation color —
         groups are a map, not vocabulary, so no Fitzgerald role. */
      .gcell {
        border-radius: 12px;
        border: 3px solid #8a8578;
        background: #f2efe6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-weight: 700;
        font-size: clamp(11px, 1.9vmin, 17px);
        color: #1a1a1a;
        overflow: hidden;
        padding: 4px;
        text-align: center;
      }
      .gcell .glyph { font-size: clamp(18px, 3.2vmin, 32px); line-height: 1; }
      .gcell .glyph img { width: 70%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
      .gcell .badge {
        font-size: clamp(9px, 1.4vmin, 12px);
        font-weight: 700;
        color: #5b5348;
        line-height: 1;
      }
      .gcell .glabel { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .gcell:active { filter: brightness(0.92); }
      .gcell.nav { border-color: #5b5348; background: #e8e3d6; font-size: clamp(13px, 2.2vmin, 20px); }
      .gcell.empty { border-style: dashed; border-color: #d8d4c8; background: transparent; }
      .gcell.empty:disabled { border-color: transparent; }
      /* Edit mode: every liftable cell goes dashed; empty slots that can
         take a drop go purple; the lifted cell gets the blue outline. */
      body.editing #groupgrid .gcell:not(.nav):not(.empty),
      body.editing #groupgrid .cell { border-style: dashed; }
      body.editing #groupgrid .gcell.drop { border-color: #8a7fbf; cursor: pointer; }
      .lifted { outline: 4px solid #2f6fd0; outline-offset: 2px; }
      body.editing #corner { font-size: 15px; }
      .cell.entity { flex-direction: column; gap: 2px; font-size: clamp(11px, 1.9vmin, 17px); }
      .cell.entity img { width: 44%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
      /* Keyboard replaces the grid in place — same 10×6 geometry, same
         physical positions. Never a modal; the strip and bar stay put. */
      #kb { flex: 1; display: none; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(6, 1fr); gap: var(--gap); }
      body.kb #grid { display: none; }
      body.kb #kb { display: grid; }
      /* Keycaps size their glyph from the key's own box
         (container-type: size): letters fill the key instead of hitting a
         px clamp. Char keys are white; space, ⌫, and the dead key wear
         utility colors. */
      .kb-key {
        container-type: size;
        border-radius: 12px;
        border: 3px solid #8a8578;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "Andika", -apple-system, "Helvetica Neue", sans-serif;
        font-weight: 700;
        color: #1a1a1a;
        overflow: hidden;
        padding: 0;
      }
      .kb-key .kc { font-size: min(70cqh, 80cqw); line-height: 1; }
      .kb-key:active { filter: brightness(0.92); }
      .kb-util { border-color: #5b5348; background: #e8e3d6; }
      .kb-util .kc { font-size: min(34cqh, 22cqw); }
      .kb-key.latched { box-shadow: inset 0 0 0 3px #5b5348; background: #ddd6c4; }
      .kb-spacekey .sub {
        font-family: -apple-system, "Helvetica Neue", sans-serif;
        font-size: min(16cqh, 12cqw);
        font-weight: 600;
        color: #5b5348;
        line-height: 1;
      }
      #bar .partial { color: #8a7fbf; }
      .cell {
        border-radius: 12px;
        border: 3px solid;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: clamp(14px, 2.6vmin, 26px);
        color: #1a1a1a;
        user-select: none;
        cursor: pointer;
        text-align: center;
        padding: 4px;
      }
      .cell:active { filter: brightness(0.92); }
      .r-Yellow { border-color: #d9a410; background: #fdf0c8; }
      .r-Green  { border-color: #2e8b3a; background: #dcf0dd; }
      .r-Blue   { border-color: #2f6fd0; background: #dcecfd; }
      .r-Pink   { border-color: #d0438c; background: #fbdfee; }
      .r-Red    { border-color: #c62828; background: #fbdcdc; }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(30, 26, 20, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .overlay.open { display: flex; }
      .sheet {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        width: min(520px, 92vw);
        max-height: 80dvh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sheet h2 { font-size: 20px; }
      .sheet input[type="text"] {
        font-size: 20px;
        padding: 10px 12px;
        border: 2px solid #d8d4c8;
        border-radius: 10px;
      }
      .sheet .row { display: flex; gap: 10px; }
      .sheet .row > * { flex: 1; }
      .btn {
        border: 2px solid #2f6fd0;
        background: #2f6fd0;
        color: #fff;
        border-radius: 10px;
        padding: 12px;
        font-size: 18px;
        font-weight: 700;
      }
      .btn.secondary { background: #fff; color: #2f6fd0; }
      .btn.danger { border-color: #c62828; background: #c62828; }
      /* Add-flow match rows: label + Fitzgerald swatch. */
      #add-matches { display: flex; flex-direction: column; gap: 8px; }
      .addmatch {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 2px solid #d8d4c8;
        border-radius: 10px;
        padding: 8px 10px;
        font-weight: 700;
        font-size: 18px;
        text-align: left;
        background: #fff;
      }
      .addmatch .swatch {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        border: 2px solid;
        flex: none;
      }
      #add-new { border-style: dashed; color: #3a352c; }
      #add-newfields { display: flex; flex-direction: column; gap: 12px; }
      .hint { color: #777; font-size: 14px; }

      /* On-screen keyboard styles live with the grid (#kb) — it is a board
         mode, not a sheet. */
    </style>
  </head>
  <body>
    <div id="topbar">
      <div id="bar" title="Sentence"></div>
      <button id="clear" class="corner-btn" title="Clear">⌫</button>
      <button id="corner" class="corner-btn" title="Parent corner">✚</button>
    </div>
    <div id="strip">
      <!-- 4 prediction slots (2 cols each) are rendered by board.js;
           the two utility anchors are permanent markup. -->
      <button class="anchor" id="anchor-groups" title="Groups">
        <span class="glyph">🗂️</span><span>Groups</span>
      </button>
      <button class="anchor" id="anchor-kb" title="Keyboard">
        <span class="glyph">⌨</span><span>Keyboard</span>
      </button>
    </div>
    <div id="grid"></div>
    <div id="groupgrid"></div>
    <div id="kb"></div>

    <div class="overlay" id="menu">
      <div class="sheet">
        <h2>Parent corner</h2>
        <button class="btn" id="add-mywords">Add to My Words</button>
        <button class="btn secondary" id="edit-groups">Edit groups</button>
        <button class="btn secondary" data-close>Close</button>
      </div>
    </div>

    <div class="overlay" id="groupform">
      <div class="sheet">
        <h2>New group</h2>
        <input type="text" id="group-name" placeholder="Group name, e.g. Sofia's snacks" autocomplete="off" />
        <label class="hint">Photo (optional)
          <input type="file" id="group-photo" accept="image/*" />
        </label>
        <div class="row">
          <button class="btn" id="group-save">Save</button>
          <button class="btn secondary" data-close>Cancel</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="delform">
      <div class="sheet">
        <h2 id="del-title">Delete group?</h2>
        <div class="row">
          <button class="btn danger" id="del-yes">Delete</button>
          <button class="btn secondary" data-close>Keep</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="addform">
      <div class="sheet">
        <h2 id="add-title">Add a word</h2>
        <input type="text" id="add-name" placeholder="Type a word or a name" autocomplete="off" />
        <div id="add-matches"></div>
        <button class="addmatch" id="add-new" hidden>New</button>
        <div id="add-newfields" hidden>
          <label class="hint">Photo (optional)
            <input type="file" id="add-photo" accept="image/*" />
          </label>
          <input type="text" id="add-hint" placeholder="Hint (optional), e.g. our dog" autocomplete="off" />
          <button class="btn" id="add-save">Save</button>
        </div>
        <button class="btn secondary" data-close>Cancel</button>
      </div>
    </div>

    <div id="pathhint" hidden></div>
    <script type="module" src="/board.js"></script>
  </body>
</html>
