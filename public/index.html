<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pip AAC</title>
    <style>
      :root { --gap: 6px; }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, "Helvetica Neue", sans-serif;
        background: #f6f4ef;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: var(--gap);
        gap: var(--gap);
      }
      button { font: inherit; cursor: pointer; }
      #topbar { display: flex; gap: var(--gap); height: 52px; }
      #bar {
        flex: 1;
        border: 2px solid #d8d4c8;
        border-radius: 10px;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 20px;
        color: #1a1a1a;
        gap: 8px;
        overflow-x: auto;
        font-weight: 600;
      }
      #bar:empty::before { content: "…"; color: #999; }
      .corner-btn {
        min-width: 52px;
        border: 2px solid #d8d4c8;
        border-radius: 10px;
        background: #fff;
        font-size: 22px;
      }
      /* Permanent strip: fixed height, always rendered. The 60-cell grid
         below never shifts — zero layout shift on prediction updates. */
      #strip {
        height: 80px;
        flex: none;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: var(--gap);
      }
      /* Prediction card: 2 columns wide, 1:1 square symbol/photo left,
         label right. Fitzgerald color of the candidate. */
      .pred {
        grid-column: span 2;
        border-radius: 12px;
        border: 3px solid #8a7fbf;
        background: #ece8f9;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: clamp(13px, 2.4vmin, 22px);
        color: #1a1a1a;
        overflow: hidden;
        text-align: left;
        padding: 0;
      }
      .pred .swatch {
        height: 100%;
        aspect-ratio: 1;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(18px, 3.4vmin, 34px);
        background: rgba(255, 255, 255, 0.55);
      }
      .pred .swatch img { width: 100%; height: 100%; object-fit: cover; }
      .pred .label { padding-right: 6px; }
      .pred.ghost {
        border-style: dashed;
        border-color: #cfc9bb;
        background: #efeadf;
        color: #a39c8a;
      }
      .pred.ghost .swatch { background: transparent; }
      /* Utility anchors: one column each, always visible. */
      .anchor {
        border-radius: 12px;
        border: 3px solid #5b5348;
        background: #e8e3d6;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-weight: 700;
        font-size: clamp(10px, 1.7vmin, 14px);
        color: #3a352c;
        overflow: hidden;
        padding: 0;
      }
      .anchor .glyph { font-size: clamp(16px, 3vmin, 28px); line-height: 1; }
      #grid { flex: 1; display: grid; gap: var(--gap); }
      /* Keyboard replaces the grid in place — same 10×6 geometry, same
         physical positions. Never a modal; the strip and bar stay put. */
      #kb { flex: 1; display: none; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(6, 1fr); gap: var(--gap); }
      body.kb #grid { display: none; }
      body.kb #kb { display: grid; }
      .kb-key {
        border-radius: 12px;
        border: 3px solid #8a8578;
        background: #f2efe6;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: clamp(18px, 3.4vmin, 34px);
        color: #1a1a1a;
      }
      .kb-key:active { filter: brightness(0.92); }
      .kb-util { border-color: #5b5348; background: #e8e3d6; font-size: clamp(13px, 2.2vmin, 20px); }
      .kb-space { grid-column: 1 / 8; grid-row: 4 / 7; }
      .kb-done  { grid-column: 8 / 11; grid-row: 4 / 7; font-size: clamp(16px, 3vmin, 28px); }
      #bar .partial { color: #8a7fbf; }
      .cell {
        border-radius: 12px;
        border: 3px solid;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: clamp(14px, 2.6vmin, 26px);
        color: #1a1a1a;
        user-select: none;
        cursor: pointer;
        text-align: center;
        padding: 4px;
      }
      .cell:active { filter: brightness(0.92); }
      .r-Yellow { border-color: #d9a410; background: #fdf0c8; }
      .r-Green  { border-color: #2e8b3a; background: #dcf0dd; }
      .r-Blue   { border-color: #2f6fd0; background: #dcecfd; }
      .r-Pink   { border-color: #d0438c; background: #fbdfee; }
      .r-Red    { border-color: #c62828; background: #fbdcdc; }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(30, 26, 20, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      .overlay.open { display: flex; }
      .sheet {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        width: min(520px, 92vw);
        max-height: 80dvh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sheet h2 { font-size: 20px; }
      .sheet input[type="text"] {
        font-size: 20px;
        padding: 10px 12px;
        border: 2px solid #d8d4c8;
        border-radius: 10px;
      }
      .sheet .row { display: flex; gap: 10px; }
      .sheet .row > * { flex: 1; }
      .btn {
        border: 2px solid #2f6fd0;
        background: #2f6fd0;
        color: #fff;
        border-radius: 10px;
        padding: 12px;
        font-size: 18px;
        font-weight: 700;
      }
      .btn.secondary { background: #fff; color: #2f6fd0; }
      .zone-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border: 3px solid #e3ded2;
        border-radius: 10px;
        font-size: clamp(12px, 1.9vmin, 17px);
        font-weight: 700;
        background: #fff;
        text-align: left;
        overflow: hidden;
      }
      /* Same anatomy as .pred: 1:1 square left, label right. Clip art lands
         inside .swatch later — geometry is already final. */
      .zone-item .swatch {
        width: 44px;
        height: 44px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.55);
        overflow: hidden;
      }
      .zone-item .swatch img { width: 100%; height: 100%; object-fit: cover; }
      .zone-item.r-Yellow { background: #fdf0c8; border-color: #d9a410; }
      .zone-item.r-Green  { background: #dcf0dd; border-color: #2e8b3a; }
      .zone-item.r-Blue   { background: #dcecfd; border-color: #2f6fd0; }
      .zone-item.r-Pink   { background: #fbdfee; border-color: #d0438c; }
      .zone-item.r-Red    { background: #fbdcdc; border-color: #c62828; }
      .zone-item.nav { padding: 14px; font-size: 18px; }
      .zone-items { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
      #zone .sheet { width: min(680px, 94vw); }
      .hint { color: #777; font-size: 14px; }

      /* On-screen keyboard styles live with the grid (#kb) — it is a board
         mode, not a sheet. */
    </style>
  </head>
  <body>
    <div id="topbar">
      <div id="bar" title="Sentence"></div>
      <button id="clear" class="corner-btn" title="Clear">⌫</button>
      <button id="corner" class="corner-btn" title="Parent corner">✚</button>
    </div>
    <div id="strip">
      <!-- 4 prediction slots (2 cols each) are rendered by board.js;
           the two utility anchors are permanent markup. -->
      <button class="anchor" id="anchor-kb" title="Keyboard">
        <span class="glyph">⌨</span><span>Keyboard</span>
      </button>
      <button class="anchor" id="anchor-groups" title="Routines &amp; groups">
        <span class="glyph">🌅</span><span>Groups</span>
      </button>
    </div>
    <div id="grid"></div>
    <div id="kb"></div>

    <div class="overlay" id="menu">
      <div class="sheet">
        <h2>Parent corner</h2>
        <button class="btn" id="add-mywords">Add a word</button>
        <button class="btn secondary" id="browse-zones">Zones</button>
        <button class="btn secondary" data-close>Close</button>
      </div>
    </div>

    <div class="overlay" id="zones">
      <div class="sheet">
        <h2>Zones</h2>
        <div id="zone-list"></div>
        <button class="btn secondary" data-close>Back</button>
      </div>
    </div>

    <div class="overlay" id="zone">
      <div class="sheet">
        <h2 id="zone-title"></h2>
        <div class="zone-items" id="zone-items"></div>
        <button class="btn" id="add-in-zone">Add a word here</button>
        <button class="btn secondary" data-close>Back</button>
      </div>
    </div>

    <div class="overlay" id="addform">
      <div class="sheet">
        <h2>Add a word</h2>
        <input type="text" id="add-name" placeholder="Name, e.g. Cooper" autocomplete="off" />
        <label class="hint">Photo (optional)
          <input type="file" id="add-photo" accept="image/*" />
        </label>
        <input type="text" id="add-hint" placeholder="Hint (optional), e.g. our dog" autocomplete="off" />
        <div class="row">
          <button class="btn" id="add-save">Save</button>
          <button class="btn secondary" data-close>Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="/board.js"></script>
  </body>
</html>
